name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_twa:
        description: 'Also build TWA Android App Bundle (.aab) for Google Play'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22.12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Verify Azure credentials
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "ERROR: AZURE_WEBAPP_PUBLISH_PROFILE secret is not set"
            exit 1
          fi
          echo "Secret is configured"

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend bundle
        run: cd client && npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'client/node_modules' \
            --exclude 'server/node_modules' \
            --exclude 'server/uploads' \
            --exclude 'client/.vite' \
            --exclude 'client/.vite-temp' \
            --exclude 'docs' \
            --exclude '.vscode' \
            --exclude '.idea' \
            --exclude 'server/.env' \
            --exclude 'twa-android' \
            ./ deploy/

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'calarie-api'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './deploy'

  # ─── TWA Android App Bundle (Google Play) ─────────────────────────────────
  # Triggered manually via workflow_dispatch with build_twa=true
  # Requires these GitHub secrets:
  #   KEYSTORE_BASE64      — base64-encoded android.keystore
  #   KEYSTORE_PASSWORD    — store password
  #   KEY_ALIAS            — calorieai
  #   KEY_PASSWORD         — key password
  build-twa:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event.inputs.build_twa == 'true'
    env:
      NODE_VERSION: '22.12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > twa-android/android.keystore

      - name: Build TWA App Bundle
        working-directory: twa-android
        env:
          KEYSTORE_PATH: ./android.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: calorieai-release-bundle
          path: twa-android/app-release-bundle.aab
          retention-days: 30

