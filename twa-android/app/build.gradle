plugins {
    id 'com.android.application'
}

android {
    namespace 'com.calorieai.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.calorieai.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // These are injected by the build environment / CI.
            // Locally: copy android.keystore into twa-android/ and set these values.
            storeFile     file(System.getenv("KEYSTORE_PATH")     ?: "android.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD")      ?: ""
            keyAlias      System.getenv("KEY_ALIAS")              ?: "calorieai"
            keyPassword   System.getenv("KEY_PASSWORD")           ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
